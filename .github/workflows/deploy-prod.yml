name: Build & Deploy to Self-Hosted PROD Runner

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, hcfi-website-prod]
    environment: production

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MODE_ENV: production
      KIA_ENV_FILE: /data/kia/nextjs-prod.env

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Write runtime env file
        run: |
          set -euo pipefail
          if [ -d "$(dirname "$KIA_ENV_FILE")" ] && [ -w "$(dirname "$KIA_ENV_FILE")" ]; then
            ENV_FILE="$KIA_ENV_FILE"
          else
            ENV_FILE="${HOME}/.kia/nextjs-prod.env"
            mkdir -p "$(dirname "$ENV_FILE")"
          fi
          echo "Using ENV_FILE=$ENV_FILE"
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

          umask 077
          {
            echo "DATABASE_URL=\"${{ secrets.DATABASE_URL }}\""
            echo "PORT=${{ secrets.PORT }}"
            echo "AWS_ACCESS_KEY_ID=\"${{ secrets.AWS_ACCESS_KEY_ID != 'EMPTY' && secrets.AWS_ACCESS_KEY_ID || '' }}\""
            echo "AWS_SECRET_ACCESS_KEY=\"${{ secrets.AWS_SECRET_ACCESS_KEY != 'EMPTY' && secrets.AWS_SECRET_ACCESS_KEY || '' }}\""
            echo "AWS_REGION=\"${{ secrets.AWS_REGION }}\""
            echo "AWS_S3_BUCKET=\"${{ secrets.AWS_S3_BUCKET }}\""
            echo "USE_MOCK_API=${{ secrets.USE_MOCK_API }}"
            echo "CREDIT_SIMULATION_USERNAME=\"${{ secrets.CREDIT_SIMULATION_USERNAME }}\""
            echo "CREDIT_SIMULATION_PASSWORD=\"${{ secrets.CREDIT_SIMULATION_PASSWORD }}\""
            echo "NEXTAUTH_URL=\"${{ secrets.NEXTAUTH_URL }}\""
            echo "NEXTAUTH_SECRET=\"${{ secrets.NEXTAUTH_SECRET }}\""
            echo "API_BASE_URL=\"${{ secrets.API_BASE_URL }}\""
            echo "NODE_ENV=production"
            echo "CSP_ENFORCE=${{ secrets.CSP_ENFORCE }}"
          } > "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          # Runtime must not depend on workspace .env
          rm -f .env
   
      - name: Build application
        run: |
          set -euo pipefail
          set -a
          source "$ENV_FILE"
          set +a
          npm run build

      - name: Apply Database Migrations
        run: |
          set -euo pipefail
          set -a
          source "$ENV_FILE"
          set +a
          npx prisma migrate deploy
          npx prisma generate

      - name: Restart App with PM2
        run: |
          set -euo pipefail
          set -a
          source "$ENV_FILE"
          set +a

          # Recreate so PM2 dump stores injected env (plain restart can keep stale env)
          pm2 delete kia-nextjs-app 2>/dev/null || true
          pm2 start npm --name kia-nextjs-app -- start
          pm2 save
          
